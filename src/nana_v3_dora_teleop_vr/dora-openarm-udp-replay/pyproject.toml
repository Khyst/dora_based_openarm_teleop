[project]
name = "dora-openarm-udp-replay"
version = "1.0.0"
authors = [{ name = "Enactic, Inc." }]
description = "Dora recorder and player nodes for VR UDP telemetry data"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "dora-rs >= 0.3.9",
  "pyarrow",
]

[project.scripts]
dora-openarm-udp-recorder = "dora_openarm_udp_replay.recorder:main"
dora-openarm-udp-player = "dora_openarm_udp_replay.player:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
