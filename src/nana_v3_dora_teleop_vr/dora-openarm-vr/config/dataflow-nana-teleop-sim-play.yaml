nodes:
  - id: quittable-tick-leader
    build: pip install -e ../../dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      tick: dora/timer/millis/2
    outputs:
      - tick

  - id: udp-player
    build: pip install -e ../../dora-openarm-udp-replay
    path: dora-openarm-udp-player
    args: "--file recordings/vr_sim_session.jsonl"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - pose_right
      - trigger_right
      - grip_right
      - pose_left
      - pose_reference
      - trigger_left
      - grip_left
      - joystick_x_left
      - joystick_y_left
      - joystick_x_right
      - joystick_y_right
      - button_a
      - button_b
      - button_x
      - button_y

  - id: ik
    build: pip install -e ../../dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--xml ../../../nana_v3_description/assets/robot/urdf/nana_v3_corrected.xml --mode bimanual --max-iters 10 --dt 0.02 --damping 1.0 --posture-cost 0.01 --lm-damping 0.1"
    inputs:
      tick: quittable-tick-leader/tick
      target_right: udp-player/pose_right
      target_left:  udp-player/pose_left
      grip_right:   udp-player/grip_right
      grip_left:    udp-player/grip_left
      trigger_right: udp-player/trigger_right
      trigger_left:  udp-player/trigger_left
    outputs:
      - position_left
      - position_right
      - status

  - id: mujoco-viewer
    build: pip install -e ../../dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: "--xml ../../../nana_v3_description/assets/robot/urdf/nana_v3_corrected.xml --keyframe home --viewer --debug-frames"
    inputs:
      position_left:  ik/position_left
      position_right: ik/position_right
      pose_right:     udp-player/pose_right
      pose_left:      udp-player/pose_left
      joystick_y:     udp-player/joystick_y_left
    outputs:
      - status

  - id: hamsa-motion
    build: pip install -e ../../dora-openarm-hamsa
    path: dora-openarm-hamsa
    inputs:
      button_a: udp-player/button_a
      button_b: udp-player/button_b
      button_x: udp-player/button_x
      button_y: udp-player/button_y
