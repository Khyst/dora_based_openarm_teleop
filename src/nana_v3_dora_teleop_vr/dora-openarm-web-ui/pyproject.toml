[project]
name = "dora-openarm-web-ui"
version = "0.1.0"
authors = [{ name = "Enactic, Inc." }]
description = "Three.js and WebGL based Web UI for OpenArm Teleoperation & Trajectory Data Collection"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "dora-rs >= 0.3.9",
  "fastapi[standard]",
  "uvicorn",
  "pyarrow",
  "pyyaml",
]

[project.scripts]
dora-openarm-web-ui = "dora_openarm_web_ui.main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dora_openarm_web_ui.templates" = [
    "*.html",
]
