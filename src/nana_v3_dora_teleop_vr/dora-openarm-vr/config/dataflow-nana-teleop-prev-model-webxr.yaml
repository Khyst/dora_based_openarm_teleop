nodes:
  - id: quittable-tick-leader
    build: pip install -e ../../dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      tick: dora/timer/millis/2
    outputs:
      - tick

  - id: webxr
    build: pip install -e ../../dora-openarm-webxr
    path: dora-openarm-webxr
    env:
      TLS_CERTIFICATE_FILE: "../../dora-openarm-webxr/example/server.crt"
      TLS_KEY_FILE: "../../dora-openarm-webxr/example/server.key"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - pose_right
      - trigger_right
      - grip_right
      - pose_left
      - trigger_left
      - grip_left
      - shoulder_right
      - shoulder_left
      - elbow_right
      - elbow_left
      - pose_reference
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times

  - id: ik
    build: pip install -e ../../dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--xml ../../../nana_v3_description/assets/robot/urdf/nana_v3.xml --mode bimanual --max-iters 10 --dt 0.02 --damping 1.0 --posture-cost 0.01 --lm-damping 0.1"
    inputs:
      tick: quittable-tick-leader/tick
      target_right: webxr/pose_right
      target_left:  webxr/pose_left
      grip_right:   webxr/trigger_right
      grip_left:    webxr/trigger_left
      trigger_right: webxr/trigger_right
      trigger_left:  webxr/trigger_left
    outputs:
      - position_left
      - position_right
      - status

  - id: mujoco-viewer
    build: pip install -e ../../dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: "--xml ../../../nana_v3_description/assets/robot/urdf/nana_v3.xml --keyframe home --viewer --debug-frames"
    inputs:
      position_left:  ik/position_left
      position_right: ik/position_right
      pose_right:     webxr/pose_right
      pose_left:      webxr/pose_left
      joystick_y:     webxr/joystick_y_left
    outputs:
      - status

  - id: follower-right
    build: pip install -e ../../dora-openarm
    path: dora-openarm
    args: "--side right --align-trigger gripper --align-delta-limit 0.0002 --start-on-startup --config ../../openarm_driver/src/openarm_driver/configs/nana_v3_cell.yaml"
    inputs:
      move_position: ik/position_right
      grip: webxr/trigger_right
    outputs:
      - state
      - status

  - id: follower-left
    build: pip install -e ../../dora-openarm
    path: dora-openarm
    args: "--side left --align-trigger gripper --align-delta-limit 0.0002 --start-on-startup --config ../../openarm_driver/src/openarm_driver/configs/nana_v3_cell.yaml"
    inputs:
      move_position: ik/position_left
      grip: webxr/trigger_left
    outputs:
      - state
      - status

  - id: hamsa-motion
    build: pip install -e ../../dora-openarm-hamsa
    path: dora-openarm-hamsa
    inputs:
      button_a: webxr/button_a
      button_b: webxr/button_b
      button_x: webxr/button_x
      button_y: webxr/button_y
