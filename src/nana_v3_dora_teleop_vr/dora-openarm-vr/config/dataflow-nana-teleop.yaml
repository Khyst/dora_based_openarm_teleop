nodes:
  - id: web-ui
    build: pip install -e ../../dora-openarm-web-ui
    path: dora-openarm-web-ui
    env:
      METADATA_FILE: "test_metadata.yaml"
    inputs:
      tick: dora/timer/millis/20
      button_a:
        source: udp-receiver/button_a
        queue_size: 100
      button_b:
        source: udp-receiver/button_b
        queue_size: 100
      button_x:
        source: udp-receiver/button_x
        queue_size: 100
      button_y:
        source: udp-receiver/button_y
        queue_size: 100
      trigger_right: 
        udp-receiver/trigger_right
      trigger_left: 
        udp-receiver/trigger_left
      grip_right: 
        udp-receiver/grip_right
      grip_left: 
        udp-receiver/grip_left
      pose_right: 
        udp-receiver/pose_right
      pose_left: 
        udp-receiver/pose_left
      pose_reference: 
        udp-receiver/pose_reference
      position_left: 
        ik/position_left
      position_right: 
        ik/position_right
      arm_status_right: 
        follower-right/status
      arm_status_left: 
        follower-left/status
    outputs:
      - command

  - id: quittable-tick-leader
    build: pip install -e ../../dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: web-ui/command
      tick: dora/timer/millis/2
    outputs:
      - tick

  - id: udp-receiver
    build: pip install -e ..
    path: dora-openarm-quest-receiver
    args: "--host 0.0.0.0 --port 5006 --scale-x 1.0 --scale-y 1.4 --scale-z 1.0"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - pose_left
      - pose_right
      - pose_reference
      - grip_right
      - grip_left
      - trigger_left
      - trigger_right
      - joystick_x_left
      - joystick_y_left
      - joystick_x_right
      - joystick_y_right
      - button_a
      - button_b
      - button_x
      - button_y
      - status

  - id: ik
    build: pip install -e ../../dora-openarm-kinematics
    path: dora-openarm-ik
    args: "--xml ../../../nana_v3_description/assets/robot/urdf/nana_v3_corrected.xml --mode bimanual --max-iters 10 --dt 0.02 --damping 0.3 --posture-cost 0.05 --reach-posture-cost 0.001 --reach-threshold 0.35 --lm-damping 0.1"
    inputs:
      tick: quittable-tick-leader/tick
      target_right: udp-receiver/pose_right
      target_left:  udp-receiver/pose_left
      grip_right:   udp-receiver/grip_right
      grip_left:    udp-receiver/grip_left
      trigger_right: udp-receiver/trigger_right
      trigger_left:  udp-receiver/trigger_left

      position_right: follower-right/position
      position_left: follower-left/position
      
    outputs:
      - position_left
      - position_right
      - status

  - id: follower-right
    build: pip install -e ../../dora-openarm
    path: dora-openarm
    args: "--side right --align-trigger gripper --align-delta-limit 0.0002 --start-on-startup --hand-can-interface can0 --config ../../../utils/openarm_driver/src/openarm_driver/configs/nana_v3_cell_v5.yaml"
    inputs:
      move_position: ik/position_right
      grip: udp-receiver/grip_right
      trigger: udp-receiver/trigger_right
      request_position: quittable-tick-leader/tick
      request_state: quittable-tick-leader/tick
    outputs:
      - state
      - status
      - position

  - id: follower-left
    build: pip install -e ../../dora-openarm
    path: dora-openarm
    args: "--side left --align-trigger gripper --align-delta-limit 0.0002 --start-on-startup --config ../../../utils/openarm_driver/src/openarm_driver/configs/nana_v3_cell_v5.yaml"
    inputs:
      move_position: ik/position_left
      grip: udp-receiver/grip_left
      trigger: udp-receiver/trigger_left
      request_position: quittable-tick-leader/tick
      request_state: quittable-tick-leader/tick
    outputs:
      - state
      - status
      - position
