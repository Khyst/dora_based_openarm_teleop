[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dora-openarm-foxglove"
version = "0.1.0"
description = "Dora node that streams robot state and VR telemetry to Foxglove Studio via WebSocket"
authors = [{ name = "Enactic, Inc." }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "dora-rs >= 0.5.0",
    "foxglove-websocket >= 0.1.4",
    "numpy",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest >= 8.1.1",
]

[project.scripts]
dora-openarm-foxglove = "dora_openarm_foxglove.main:main"

[tool.setuptools.packages.find]
where = ["src"]
