[project]
name = "dora-openarm-hamsa"
version = "1.0.0"
authors = [{ name = "Enactic, Inc." }]
description = "Dora node for Hamsa hand motion control via VR buttons"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "dora-rs >= 0.3.9",
  "pyarrow",
]

[project.scripts]
dora-openarm-hamsa = "dora_openarm_hamsa.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
